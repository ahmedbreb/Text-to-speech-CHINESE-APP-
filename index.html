<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Custom Chunk Trainer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --accent-hover: #9955ef;
            --border-color: #333;
            --highlight-color: #ffb74d;
            --active-play: #03dac6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.4rem;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background-color: #2a2a2a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 1.1rem;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #121212;
            width: 100%;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .char-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
            padding: 12px;
            background: #252525;
            border-radius: 8px;
        }

        .char-tile {
            background: #333;
            color: #fff;
            padding: 10px 14px;
            font-size: 1.3rem;
            border-radius: 6px;
            border: 2px solid transparent;
            user-select: none;
        }

        .char-tile.highlighted {
            border-color: var(--highlight-color);
            background: #5c4314;
            color: #fff;
            font-weight: bold;
        }

        .char-tile.chunked {
            opacity: 0.3;
            background: #1a1a1a;
            border-color: #333;
        }

        .divide-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-step {
            background-color: #3700b3;
            color: #fff;
            flex: 1;
        }

        .btn-make {
            background-color: var(--highlight-color);
            color: #121212;
            flex: 1;
        }

        .chunks-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
            min-height: 40px;
        }

        .chunk-badge {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 1.1rem;
        }

        .chunk-badge.active-playback {
            border-color: var(--active-play);
            background: #003733;
            color: #03dac6;
            font-weight: bold;
        }

        .large-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-large {
            padding: 18px;
            font-size: 1.2rem;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .btn-play-next {
            background-color: var(--active-play);
            color: #121212;
        }

        .btn-play-next:hover {
            background-color: #02b3a2;
        }

        .btn-reset {
            background-color: #cf6679;
            color: #121212;
        }

        .btn-reset:hover {
            background-color: #b04e60;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Chinese Custom Chunk Trainer</h2>

        <!-- Step 1: Input -->
        <div class="section">
            <label for="sentenceInput">Enter Chinese Sentence:</label>
            <textarea id="sentenceInput" placeholder="例如：我想去中国学习汉语">我想去中国学习汉语</textarea>
            <button class="btn btn-primary" id="startDivideBtn">1. Start Dividing Sentence</button>
        </div>

        <!-- Step 2: Division Workspace -->
        <div class="section" id="divideSection" style="display:none;">
            <label>Highlight & Create Chunks:</label>
            <div class="char-grid" id="charGrid"></div>
            <div class="divide-controls">
                <button class="btn btn-step" id="addCharBtn">➕ Add Character</button>
                <button class="btn btn-make" id="saveChunkBtn">✂️ Save Chunk</button>
            </div>
        </div>

        <!-- Step 3: Playback Dashboard -->
        <div class="section" id="chunksSection" style="display:none;">
            <label>Your Created Chunks:</label>
            <div class="chunks-list" id="chunksList"></div>

            <div class="large-controls">
                <button class="btn btn-large btn-play-next" id="playNextBtn">▶ PLAY NEXT CHUNK</button>
                <button class="btn btn-large btn-reset" id="resetBtn">🔄 RESET TO START</button>
            </div>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let chineseVoice = null;
        let preloadedUtterances = [];

        function loadVoices() {
            const voices = synth.getVoices();
            chineseVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN')) || null;
        }
        loadVoices();
        if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

        // Instant audio playback with zero delay
        function speakInstant(text) {
            synth.cancel(); // Stop any active speech immediately
            if (!text) return;
            
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'zh-CN';
            if (chineseVoice) u.voice = chineseVoice;
            u.rate = 0.85; // Slightly clear listening pace

            synth.speak(u);
        }

        let chars = [];
        let cursorIndex = 0;
        let selectedIndices = [];
        let chunks = [];
        let currentPlaybackIndex = 0;

        const sentenceInput = document.getElementById('sentenceInput');
        const startDivideBtn = document.getElementById('startDivideBtn');
        const divideSection = document.getElementById('divideSection');
        const charGrid = document.getElementById('charGrid');
        const addCharBtn = document.getElementById('addCharBtn');
        const saveChunkBtn = document.getElementById('saveChunkBtn');
        const chunksSection = document.getElementById('chunksSection');
        const chunksList = document.getElementById('chunksList');
        const playNextBtn = document.getElementById('playNextBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Warm up speech synthesis on user interaction to eliminate audio delay
        function warmupAudio() {
            const silentUtterance = new SpeechSynthesisUtterance('');
            synth.speak(silentUtterance);
        }

        startDivideBtn.addEventListener('click', () => {
            warmupAudio();
            const text = sentenceInput.value.trim();
            if (!text) return;

            chars = Array.from(text);
            cursorIndex = 0;
            selectedIndices = [];
            chunks = [];
            currentPlaybackIndex = 0;

            divideSection.style.display = 'block';
            chunksSection.style.display = 'block'; // Keep visible to show real-time progress
            renderCharGrid();
            renderChunksList();
        });

        function renderCharGrid() {
            charGrid.innerHTML = '';
            chars.forEach((c, idx) => {
                const tile = document.createElement('div');
                tile.className = 'char-tile';

                if (selectedIndices.includes(idx)) {
                    tile.classList.add('highlighted');
                } else if (isIndexChunked(idx)) {
                    tile.classList.add('chunked');
                }

                tile.textContent = c;
                charGrid.appendChild(tile);
            });
        }

        function isIndexChunked(idx) {
            return chunks.some(chunk => idx >= chunk.start && idx < chunk.end);
        }

        // Button 1: Add character to current highlight selection
        addCharBtn.addEventListener('click', () => {
            if (cursorIndex >= chars.length) {
                alert("You've reached the end of the sentence.");
                return;
            }

            selectedIndices.push(cursorIndex);
            cursorIndex++;
            renderCharGrid();
        });

        // Button 2: Save whatever is highlighted into its own chunk
        saveChunkBtn.addEventListener('click', () => {
            if (selectedIndices.length === 0) {
                alert("Press 'Add Character' first to select characters for this chunk.");
                return;
            }

            const start = selectedIndices[0];
            const end = selectedIndices[selectedIndices.length - 1] + 1;
            const text = chars.slice(start, end).join('');

            chunks.push({ text, start, end });
            selectedIndices = []; // Clear highlight state for the next chunk
            renderCharGrid();
            renderChunksList();
        });

        function renderChunksList() {
            chunksList.innerHTML = '';
            if (chunks.length === 0) {
                chunksList.innerHTML = '<span style="color:#777;">No chunks created yet.</span>';
                return;
            }

            chunks.forEach((chunk, idx) => {
                const badge = document.createElement('div');
                badge.className = 'chunk-badge';
                if (idx === currentPlaybackIndex) {
                    badge.classList.add('active-playback');
                }
                badge.textContent = `${idx + 1}: ${chunk.text}`;
                chunksList.appendChild(badge);
            });
        }

        // Large Button 1: Immediate Playback with Auto-Looping
        playNextBtn.addEventListener('click', () => {
            if (chunks.length === 0) return;

            // Highlight current chunk
            renderChunksList();

            // Speak immediately
            speakInstant(chunks[currentPlaybackIndex].text);

            // Move index forward for next press; auto-loop if reached end
            currentPlaybackIndex = (currentPlaybackIndex + 1) % chunks.length;
        });

        // Large Button 2: Reset position to start
        resetBtn.addEventListener('click', () => {
            currentPlaybackIndex = 0;
            synth.cancel();
            renderChunksList();
        });
    </script>
</body>
</html>
