<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Sentence Chunk Trainer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --accent-hover: #9955ef;
            --border-color: #333;
            --highlight-color: #ffb74d;
            --active-play: #03dac6;
            --lock-active: #e65100; /* Dark Orange */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        #setupPage {
            max-width: 650px;
            margin: 0 auto;
            overflow-y: auto;
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.4rem;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background-color: #2a2a2a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 1.1rem;
            resize: none;
            user-select: text;
            -webkit-user-select: text;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .input-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-clear {
            background-color: #cf6679;
            color: #121212;
            flex: 1;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #121212;
            flex: 2;
        }

        .char-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
            padding: 12px;
            background: #252525;
            border-radius: 8px;
        }

        .char-tile {
            background: #333;
            color: #fff;
            padding: 10px 14px;
            font-size: 1.3rem;
            border-radius: 6px;
            border: 2px solid transparent;
        }

        .char-tile.highlighted {
            border-color: var(--highlight-color);
            background: #5c4314;
        }

        .char-tile.chunked {
            opacity: 0.3;
            background: #1a1a1a;
        }

        .divide-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-step {
            background-color: #3700b3;
            color: #fff;
            flex: 1;
            min-width: 120px;
        }

        .btn-make {
            background-color: var(--highlight-color);
            color: #121212;
            flex: 1;
            min-width: 120px;
        }

        .btn-undo {
            background-color: #444;
            color: #ff8a80;
            width: 100%;
            margin-top: 5px;
        }

        .chunks-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }

        .chunk-badge {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 1.1rem;
        }

        /* Fullscreen Player Page */
        #playerPage {
            display: none;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            padding: 16px;
            background-color: #0d0d0d;
            outline: none;
        }

        .tap-area {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding: 20px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .large-chunk-display {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: bold;
            color: var(--active-play);
            text-align: center;
            word-break: break-all;
            margin-bottom: 20px;
        }

        .chunk-counter {
            font-size: 1.2rem;
            color: #777;
        }

        .player-controls {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-player {
            padding: 16px;
            font-size: 1.1rem;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            outline: none;
        }

        .btn-lock {
            background-color: #333;
            color: #fff;
        }

        .btn-lock.locked {
            background-color: var(--lock-active);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(230, 81, 0, 0.6);
        }

        .btn-reset {
            background-color: #cf6679;
            color: #121212;
        }

        .btn-back {
            background-color: #222;
            color: #aaa;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <!-- PAGE 1: SETUP SCREEN -->
    <div id="setupPage" class="page">
        <h2>Chinese Custom Chunk Trainer</h2>

        <div class="section">
            <label for="sentenceInput">Enter Chinese Sentence:</label>
            <textarea id="sentenceInput" placeholder="例如：我想去中国学习汉语">我想去中国学习汉语</textarea>
            <div class="input-actions">
                <button class="btn btn-clear" id="clearTextBtn">🗑 Clear Text</button>
                <button class="btn btn-primary" id="startDivideBtn">1. Start Dividing</button>
            </div>
        </div>

        <div class="section" id="divideSection" style="display:none;">
            <label>Highlight & Create Chunks:</label>
            <div class="char-grid" id="charGrid"></div>
            <div class="divide-controls">
                <button class="btn btn-step" id="addCharBtn">➕ Add Character</button>
                <button class="btn btn-make" id="saveChunkBtn">✂️ Save Chunk</button>
                <button class="btn btn-undo" id="resetSelectionBtn">↩ Undo Highlight / Chunk</button>
            </div>
        </div>

        <div class="section" id="chunksSection" style="display:none;">
            <label>Created Chunks:</label>
            <div class="chunks-list" id="chunksList"></div>
            <button class="btn btn-primary" id="goToPlayerBtn" style="padding:16px; font-size:1.2rem; margin-top:10px;">▶ Open Fullscreen Player</button>
        </div>
    </div>

    <!-- PAGE 2: FULLSCREEN PLAYER -->
    <div id="playerPage" class="page">
        <div class="tap-area" id="tapArea">
            <div class="large-chunk-display" id="largeDisplay">准备</div>
            <div class="chunk-counter" id="chunkCounter">Tap anywhere to start</div>
        </div>

        <div class="player-controls">
            <button class="btn btn-player btn-lock" id="lockBtn">🔓 Lock Current Chunk</button>
            <button class="btn btn-player btn-reset" id="resetBtn">🔄 Reset to Beginning</button>
            <button class="btn btn-player btn-back" id="backBtn">⬅ Edit / New Sentence</button>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let chineseVoice = null;
        let audioCtx = null;

        function loadVoices() {
            const voices = synth.getVoices();
            chineseVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN') || v.lang.includes('cmn')) || null;
        }
        loadVoices();
        if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            synth.cancel();
        }

        function speakText(text) {
            initAudioContext();
            if (!text) return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            if (chineseVoice) utterance.voice = chineseVoice;
            utterance.rate = 0.85;

            synth.speak(utterance);
        }

        let chars = [];
        let cursorIndex = 0;
        let selectedIndices = [];
        let chunks = [];
        let currentPlaybackIndex = 0;
        let isLocked = false;

        const setupPage = document.getElementById('setupPage');
        const playerPage = document.getElementById('playerPage');
        const sentenceInput = document.getElementById('sentenceInput');
        const clearTextBtn = document.getElementById('clearTextBtn');
        const startDivideBtn = document.getElementById('startDivideBtn');
        const divideSection = document.getElementById('divideSection');
        const charGrid = document.getElementById('charGrid');
        const addCharBtn = document.getElementById('addCharBtn');
        const saveChunkBtn = document.getElementById('saveChunkBtn');
        const resetSelectionBtn = document.getElementById('resetSelectionBtn');
        const chunksSection = document.getElementById('chunksSection');
        const chunksList = document.getElementById('chunksList');
        const goToPlayerBtn = document.getElementById('goToPlayerBtn');
        
        const tapArea = document.getElementById('tapArea');
        const largeDisplay = document.getElementById('largeDisplay');
        const chunkCounter = document.getElementById('chunkCounter');
        const lockBtn = document.getElementById('lockBtn');
        const resetBtn = document.getElementById('resetBtn');
        const backBtn = document.getElementById('backBtn');

        clearTextBtn.addEventListener('click', () => {
            sentenceInput.value = '';
            sentenceInput.focus();
        });

        startDivideBtn.addEventListener('click', () => {
            initAudioContext();
            const text = sentenceInput.value.trim();
            if (!text) return;

            chars = Array.from(text);
            cursorIndex = 0;
            selectedIndices = [];
            chunks = [];
            currentPlaybackIndex = 0;

            divideSection.style.display = 'block';
            chunksSection.style.display = 'block';
            renderCharGrid();
            renderChunksList();
        });

        function renderCharGrid() {
            charGrid.innerHTML = '';
            chars.forEach((c, idx) => {
                const tile = document.createElement('div');
                tile.className = 'char-tile';

                if (selectedIndices.includes(idx)) {
                    tile.classList.add('highlighted');
                } else if (isIndexChunked(idx)) {
                    tile.classList.add('chunked');
                }

                tile.textContent = c;
                charGrid.appendChild(tile);
            });
        }

        function isIndexChunked(idx) {
            return chunks.some(chunk => idx >= chunk.start && idx < chunk.end);
        }

        addCharBtn.addEventListener('click', () => {
            if (cursorIndex >= chars.length) return;
            selectedIndices.push(cursorIndex);
            cursorIndex++;
            renderCharGrid();
        });

        saveChunkBtn.addEventListener('click', () => {
            if (selectedIndices.length === 0) return;

            const start = selectedIndices[0];
            const end = selectedIndices[selectedIndices.length - 1] + 1;
            const text = chars.slice(start, end).join('');

            chunks.push({ text, start, end });
            selectedIndices = [];
            renderCharGrid();
            renderChunksList();
        });

        // Smart Undo: Clears active selection first; if none active, removes the last saved chunk
        resetSelectionBtn.addEventListener('click', () => {
            if (selectedIndices.length > 0) {
                cursorIndex = selectedIndices[0];
                selectedIndices = [];
            } else if (chunks.length > 0) {
                const lastChunk = chunks.pop();
                cursorIndex = lastChunk.start;
            }
            renderCharGrid();
            renderChunksList();
        });

        function renderChunksList() {
            chunksList.innerHTML = '';
            chunks.forEach((chunk, idx) => {
                const badge = document.createElement('div');
                badge.className = 'chunk-badge';
                badge.textContent = `${idx + 1}: ${chunk.text}`;
                chunksList.appendChild(badge);
            });
        }

        function openPlayer() {
            if (chunks.length === 0) {
                alert("Please create at least one chunk first.");
                return;
            }
            setupPage.style.display = 'none';
            playerPage.style.display = 'flex';
            currentPlaybackIndex = 0;
            updatePlayerUI();
        }

        goToPlayerBtn.addEventListener('click', openPlayer);

        function updatePlayerUI() {
            if (chunks.length === 0) return;
            const currentChunk = chunks[currentPlaybackIndex];
            largeDisplay.textContent = currentChunk.text;
            chunkCounter.textContent = `Chunk ${currentPlaybackIndex + 1} of ${chunks.length}`;
        }

        tapArea.addEventListener('click', () => {
            if (chunks.length === 0) return;

            speakText(chunks[currentPlaybackIndex].text);
            updatePlayerUI();

            if (!isLocked) {
                currentPlaybackIndex = (currentPlaybackIndex + 1) % chunks.length;
            }
        });

        lockBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isLocked = !isLocked;
            if (isLocked) {
                lockBtn.textContent = '🔒 Chunk Locked (Repeating)';
                lockBtn.classList.add('locked');
            } else {
                lockBtn.textContent = '🔓 Lock Current Chunk';
                lockBtn.classList.remove('locked');
            }
        });

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentPlaybackIndex = 0;
            synth.cancel();
            updatePlayerUI();
        });

        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            synth.cancel();
            playerPage.style.display = 'none';
            setupPage.style.display = 'flex';
        });
    </script>
</body>
</html>
